
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your DeveloperHomes account and join the developer community.">
    <title>Create Account | DeveloperHomes</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <script src="/js/app.js" defer></script>
    <script src="/js/auth.js" defer></script>
</head>

<body class="auth-page">

    <header class="site-header">
        <nav class="navbar container" aria-label="Main navigation">

            <a href="/" class="logo">
                <span class="logo-icon">D</span>
                <span>Developer<span class="logo-highlight">Homes</span></span>
            </a>

            <a href="/" class="btn btn-outline">← Back Home</a>

        </nav>
    </header>

    <main class="auth-main">

        <section class="auth-card register-card">

            <div class="auth-heading">
                <div class="auth-icon">🚀</div>

                <h1>Create Your Account</h1>

                <p>
                    Join DeveloperHomes and start building your future.
                </p>
            </div>

            <div id="authMessage"
                 class="message"
                 role="alert"
                 aria-live="polite"
                 hidden>
            </div>

            <form id="registerForm" class="auth-form">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="50"
                        pattern="[A-Za-z0-9_]+"
                        autocomplete="username"
                        required
                    >

                    <small>Use letters, numbers, and underscores only.</small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">
                            Show
                        </button>
                    </div>

                    <small>Password must contain at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <label class="terms-label">
                    <input
                        type="checkbox"
                        id="acceptTerms"
                        name="acceptTerms"
                        required
                    >

                    <span>
                        I agree to use DeveloperHomes responsibly.
                    </span>
                </label>

                <button
                    type="submit"
                    id="registerButton"
                    class="btn btn-primary btn-full">
                    Create My Account →
                </button>

            </form>

            <div class="auth-divider">
                <span>ALREADY A MEMBER?</span>
            </div>

            <p class="auth-switch">
                Already have an account?
                <a href="/login.html">Login here</a>
            </p>

        </section>

    </main>

    <footer class="auth-footer">
        <p>© <span id="currentYear"></span> DeveloperHomes. All rights reserved.</p>
    </footer>

</body>
</html>
