
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your DeveloperHomes account.">
    <title>Login | DeveloperHomes</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <script src="/js/app.js" defer></script>
    <script src="/js/auth.js" defer></script>
</head>

<body class="auth-page">

    <header class="site-header">
        <nav class="navbar container" aria-label="Main navigation">

            <a href="/" class="logo">
                <span class="logo-icon">D</span>
                <span>Developer<span class="logo-highlight">Homes</span></span>
            </a>

            <a href="/" class="btn btn-outline">← Back Home</a>

        </nav>
    </header>

    <main class="auth-main">
        <section class="auth-card">

            <div class="auth-heading">
                <div class="auth-icon">🔐</div>

                <h1>Welcome Back!</h1>

                <p>
                    Login to continue your developer journey.
                </p>
            </div>

            <div id="authMessage"
                 class="message"
                 role="alert"
                 aria-live="polite"
                 hidden>
            </div>

            <form id="loginForm" class="auth-form">

                <div class="form-group">
                    <label for="identifier">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary btn-full">
                    Login to Account →
                </button>

            </form>

            <div class="auth-divider">
                <span>NEW TO DEVELOPERHOMES?</span>
            </div>

            <p class="auth-switch">
                Don't have an account?
                <a href="/register.html">Create an account</a>
            </p>

            <p class="auth-footer-note">
                By logging in, you agree to use DeveloperHomes responsibly.
            </p>

        </section>
    </main>

    <footer class="auth-footer">
        <p>© <span id="currentYear"></span> DeveloperHomes. All rights reserved.</p>
    </footer>

</body>
</html>
