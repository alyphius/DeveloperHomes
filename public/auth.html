
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10172a">

    <title>DeveloperHomes | Authentication</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #0f172a, #172554, #312e81);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.09);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .logo span {
            color: #60a5fa;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            padding: 5px;
            border-radius: 12px;
            background: rgba(0,0,0,.25);
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #cbd5e1;
            font-weight: bold;
            cursor: pointer;
        }

        .tab.active {
            background: #2563eb;
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        h2 {
            font-size: 23px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #e2e8f0;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 10px;
            outline: none;
            background: rgba(15,23,42,.75);
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 2px rgba(96,165,250,.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .status {
            display: block;
            min-height: 17px;
            margin-top: 5px;
            font-size: 12px;
        }

        .submit {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .submit:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: rgba(239,68,68,.18);
            color: #fecaca;
        }

        .message.success {
            display: block;
            background: rgba(34,197,94,.18);
            color: #bbf7d0;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media(max-width:480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Developer<span>Homes</span>
    </div>

    <p class="subtitle">
        Connect. Build. Learn. Grow together.
    </p>

    <!-- LOGIN / REGISTER TABS -->
    <div class="tabs">
        <button type="button" class="tab active" id="loginTab">
            Login
        </button>

        <button type="button" class="tab" id="registerTab">
            Register
        </button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="form active">

        <h2>Welcome Back 👋</h2>

        <label for="loginIdentifier">
            Username or Email
        </label>

        <input
            id="loginIdentifier"
            type="text"
            placeholder="Enter username or email"
            autocomplete="username"
            required
        >

        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit" class="submit">
            Login to DeveloperHomes
        </button>

        <div id="loginMessage" class="message"></div>

    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="form">

        <h2>Create Account 🚀</h2>

        <label for="regUsername">
            Username
        </label>

        <input
            id="regUsername"
            type="text"
            placeholder="Choose username"
            minlength="3"
            maxlength="50"
            autocomplete="username"
            required
        >

        <small id="usernameStatus" class="status"></small>

        <label for="regEmail">
            Email
        </label>

        <input
            id="regEmail"
            type="email"
            placeholder="Enter email address"
            autocomplete="email"
            required
        >

        <small id="emailStatus" class="status"></small>

        <label for="regPassword">
            Password
        </label>

        <input
            id="regPassword"
            type="password"
            placeholder="Create password (8+ characters)"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm password"
            autocomplete="new-password"
            required
        >

        <button type="submit" class="submit">
            Create Account
        </button>

        <div id="registerMessage" class="message"></div>

    </form>

    <div class="footer">
        © 2026 DeveloperHomes. Built for developers.
    </div>

</div>

<script>

// =====================================
// ELEMENTS
// =====================================

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

const loginMessage = document.getElementById("loginMessage");
const registerMessage = document.getElementById("registerMessage");


// =====================================
// TAB SWITCHING
// =====================================

function showTab(tab) {

    const isLogin = tab === "login";

    loginTab.classList.toggle("active", isLogin);
    registerTab.classList.toggle("active", !isLogin);

    loginForm.classList.toggle("active", isLogin);
    registerForm.classList.toggle("active", !isLogin);

    clearMessages();
}

loginTab.addEventListener("click", () => showTab("login"));

registerTab.addEventListener("click", () => showTab("register"));


function clearMessages() {

    document.querySelectorAll(".message").forEach(element => {
        element.className = "message";
        element.textContent = "";
    });
}


function showMessage(id, message, type) {

    const element = document.getElementById(id);

    element.textContent = message;
    element.className = "message " + type;
}


// =====================================
// API REQUEST
// =====================================

async function apiRequest(url, options = {}) {

    const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || data.success === false) {
        throw new Error(data.message || "Request failed.");
    }

    return data;
}


// =====================================
// LOGIN WITH USERNAME OR EMAIL
// =====================================

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();
    clearMessages();

    const identifier =
        document.getElementById("loginIdentifier").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const button = loginForm.querySelector(".submit");

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

        const data = await apiRequest("/api/auth/login", {
            method: "POST",

            body: JSON.stringify({
                identifier: identifier,
                password: password
            })
        });

        if (!data.success || !data.user) {
            throw new Error("Login response was incomplete.");
        }

        showMessage(
            "loginMessage",
            "Login successful! Redirecting...",
            "success"
        );

        const role = data.user.role;

        if (role === "owner" || role === "manager") {
            window.location.replace("/admin.html");
        } else {
            window.location.replace("/dashboard.html");
        }

    } catch (error) {

        showMessage(
            "loginMessage",
            error.message,
            "error"
        );

        button.disabled = false;
        button.textContent = "Login to DeveloperHomes";
    }

});


// =====================================
// USERNAME / EMAIL AVAILABILITY
// =====================================

let usernameTimer;
let emailTimer;

let usernameAvailable = null;
let emailAvailable = null;

let usernameRequest = 0;
let emailRequest = 0;


async function checkAvailability(field, value, statusId) {

    const status = document.getElementById(statusId);

    const requestId = field === "username"
        ? ++usernameRequest
        : ++emailRequest;

    status.style.color = "#cbd5e1";
    status.textContent = "Checking...";

    try {

        const params = new URLSearchParams();

        params.set(field, value);

        const data = await apiRequest(
            "/api/auth/check-availability?" + params.toString()
        );

        if (
            requestId !== (
                field === "username" ? usernameRequest : emailRequest
            )
        ) return;

        const result = data[field];

        if (!result) {
            throw new Error("Availability result missing.");
        }

        if (field === "username") {
            usernameAvailable = result.available;
        } else {
            emailAvailable = result.available;
        }

        status.textContent = result.message;

        status.style.color = result.available
            ? "#4ade80"
            : "#f87171";

    } catch (error) {

        if (
            requestId !== (
                field === "username" ? usernameRequest : emailRequest
            )
        ) return;

        if (field === "username") usernameAvailable = null;
        if (field === "email") emailAvailable = null;

        status.style.color = "#fbbf24";
        status.textContent = "Could not verify. Try again.";
    }
}


// USERNAME INPUT

document.getElementById("regUsername").addEventListener("input", function() {

    clearTimeout(usernameTimer);

    usernameAvailable = null;
    usernameRequest++;

    const value = this.value.trim();

    const status = document.getElementById("usernameStatus");

    status.textContent = "";

    if (value.length < 3) return;

    if (!/^[a-zA-Z0-9_]{3,50}$/.test(value)) {
        status.style.color = "#f87171";
        status.textContent = "Use 3–50 letters, numbers or underscores.";
        return;
    }

    usernameTimer = setTimeout(() => {
        checkAvailability("username", value, "usernameStatus");
    }, 500);

});


// EMAIL INPUT

document.getElementById("regEmail").addEventListener("input", function() {

    clearTimeout(emailTimer);

    emailAvailable = null;
    emailRequest++;

    const value = this.value.trim();

    const status = document.getElementById("emailStatus");

    status.textContent = "";

    if (!this.validity.valid || !value) return;

    emailTimer = setTimeout(() => {
        checkAvailability("email", value, "emailStatus");
    }, 500);

});


// =====================================
// REGISTER NEW USER
// =====================================

registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();
    clearMessages();

    const username =
        document.getElementById("regUsername").value.trim();

    const email =
        document.getElementById("regEmail").value.trim();

    const password =
        document.getElementById("regPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (!/^[a-zA-Z0-9_]{3,50}$/.test(username)) {

        showMessage(
            "registerMessage",
            "Username must contain 3–50 letters, numbers or underscores.",
            "error"
        );

        return;
    }


    if (password.length < 8) {

        showMessage(
            "registerMessage",
            "Password must contain at least 8 characters.",
            "error"
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "registerMessage",
            "Passwords do not match.",
            "error"
        );

        return;
    }


    const button = registerForm.querySelector(".submit");

    button.disabled = true;
    button.textContent = "Creating account...";


    try {

        const data = await apiRequest("/api/auth/register", {

            method: "POST",

            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })

        });


        showMessage(
            "registerMessage",
            data.message || "Account created successfully!",
            "success"
        );

        registerForm.reset();

        usernameAvailable = null;
        emailAvailable = null;

        document.getElementById("usernameStatus").textContent = "";
        document.getElementById("emailStatus").textContent = "";

        setTimeout(() => {

            document.getElementById("loginIdentifier").value = email;

            document.getElementById("loginPassword").value = "";

            showTab("login");

        }, 1500);


    } catch (error) {

        showMessage(
            "registerMessage",
            error.message,
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent = "Create Account";

    }

});

</script>

</body>
</html>
